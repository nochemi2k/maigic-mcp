services:
  maigic-mcp:
    build: .
    image: maigic-mcp:latest
    container_name: maigic-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',${MCP_PORT}),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
